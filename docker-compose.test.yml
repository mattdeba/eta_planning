services:
  postgres-test:
    image: postgres:16-alpine
    container_name: my_eta_planning_postgres_test
    environment:
      POSTGRES_DB: eta_planning_test
      POSTGRES_USER: eta_test
      POSTGRES_PASSWORD: eta_test
    ports:
      - '5434:5432'
    volumes:
      - eta-postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eta_test -d eta_planning_test']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eta-postgres-test-data:
