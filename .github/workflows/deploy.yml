name: Deploy backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: my-eta-planning-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 20 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts

      - name: Sync backend
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p $VPS_PORT" \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage \
            --exclude .git \
            --exclude .github \
            --exclude .idea \
            --exclude .vscode \
            --exclude '.env*' \
            --exclude docker-compose.production.yml \
            ./ "$VPS_USER@$VPS_HOST:/opt/my_eta_planning/backend/"

      - name: Restart stack
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "/opt/my_eta_planning/start.sh"

      - name: Verify API
        run: |
          curl -fsS "http://$VPS_HOST/api/health"
